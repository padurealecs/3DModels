<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Library - Neutral Light</title>
    <style>
        :root {
            --bg-main: #e0e0e0;        /* Gri neutru deschis */
            --bg-card: #ffffff;      /* Alb curat pentru contrast */
            --accent: #5c85d6;         
            --text-main: #333333;
            --text-dim: #666666;
            --border: #cccccc;
        }

        body { 
            margin: 0; font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg-main); color: var(--text-main); 
            overflow-x: hidden;
        }

        header { 
            padding: 50px 20px; text-align: center; 
            background: var(--bg-card);
            border-bottom: 1px solid var(--border); 
        }

        h1 { margin: 0; font-weight: 800; letter-spacing: -1px; font-size: 2.2rem; }

        .controls { display: flex; justify-content: center; gap: 12px; margin-top: 25px; flex-wrap: wrap; }

        input, select { 
            padding: 12px 18px; background: white; border: 1px solid var(--border); 
            color: #333; border-radius: 8px; outline: none; transition: 0.2s; font-size: 14px;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92, 133, 214, 0.1); }

        /* Asset Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px; padding: 50px;
            max-width: 1400px; margin: 0 auto;
        }

        .card {
            background: var(--bg-card); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s, border-color 0.3s; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 10px 15px rgba(0,0,0,0.06); }

        /* Thumbnail Area with light gray background to pop the models */
        .thumb-box {
            width: 100%; height: 180px; background: #eaeaea;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid var(--border);
        }
        .thumb-img { width: 100%; height: 100%; object-fit: contain; }
        .gen-text { font-size: 11px; color: #999; font-family: monospace; }

        .card-info { padding: 20px; }
        .card-name { display: block; font-weight: 700; margin-bottom: 6px; font-size: 1.1rem; }
        .tag { font-size: 0.65rem; color: var(--text-dim); background: #eee; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-weight: 600; }

        /* Modal View */
        .modal {
            display: none; position: fixed; inset: 0; 
            background: rgba(255,255,255,0.85); z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            width: 90%; max-width: 1100px; margin: 3% auto;
            background: white; border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border); position: relative;
            box-shadow: 0 30px 50px rgba(0,0,0,0.1);
        }
        
        #viewer { width: 100%; height: 550px; background: #fdfdfd; }
        
        .modal-footer { 
            padding: 25px 40px; display: flex; justify-content: space-between; 
            align-items: center; background: white; 
            border-top: 1px solid var(--border);
        }
        
        .stats-container { display: flex; flex-direction: column; gap: 4px; }
        .m-title { margin: 0; font-size: 1.6rem; color: #111; font-weight: 800; }
        .m-stats { color: var(--text-dim); font-family: monospace; font-size: 0.9rem; margin: 0; }

        #download-btn {
            background: #111; color: white; border: none;
            padding: 14px 28px; border-radius: 10px; cursor: pointer;
            font-weight: 700; font-size: 0.9rem; transition: 0.2s;
        }
        #download-btn:hover { background: var(--accent); transform: scale(1.05); }

        .close-btn {
            position: absolute; top: 20px; right: 25px; color: #333;
            font-size: 35px; cursor: pointer; z-index: 1001; font-weight: 200;
        }
        .close-btn:hover { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>3D ASSET LIBRARY</h1>
    <div class="controls">
        <input type="text" id="search" placeholder="Search models...">
        <select id="filter">
            <option value="all">All Categories</option>
            <option value="Characters">Characters</option>
            <option value="Interactable">Interactable</option>
            <option value="Props">Props</option>
            <option value="Decor">Decor</option>
        </select>
    </div>
</header>

<div class="grid" id="asset-grid"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="close-modal">&times;</span>
        <div id="viewer"></div>
        <div class="modal-footer">
            <div class="stats-container">
                <h2 id="m-title" class="m-title">Asset Name</h2>
                <p id="m-stats" class="m-stats">Triangles: 0 | Vertices: 0</p>
            </div>
            <button id="download-btn">DOWNLOAD MODEL</button>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const myModels = [
        { name: "Crate", file: "Crate.fbx", cat: "Interactable" },
        { name: "Robo Arm", file: "RoboArm.fbx", cat: "Interactable" },
        { name: "Robo Arm 2", file: "RoboArm2.fbx", cat: "Interactable" },
        
        { name: "Robot Classic", file: "Robot.fbx", cat: "Characters" },
        { name: "Robot V2", file: "RobotV2.fbx", cat: "Characters" },
        { name: "Robot V3", file: "RobotV3.fbx", cat: "Characters" },
        { name: "Robot V4", file: "RobotV4.fbx", cat: "Characters" },

        { name: "Generator", file: "Generator.fbx", cat: "Props" },
        { name: "Industrial Tank", file: "IndustrialTank.fbx", cat: "Props" },
        { name: "Tank Stand", file: "IndustrialTankStand.fbx", cat: "Props" },
        { name: "Tank Tower", file: "IndustrialTankTower.fbx", cat: "Props" },
        { name: "Reservoir", file: "Reservoir.fbx", cat: "Props" },
        { name: "Stand Button", file: "StandButton.fbx", cat: "Props" },
        { name: "Wooden Pallet", file: "WoodenPallet.fbx", cat: "Props" },
        { name: "Wooden Pallet V2", file: "WoodenPalletV2.fbx", cat: "Props" },
        { name: "Metal Barrel", file: "MetalBarrel.fbx", cat: "Props" },

        { name: "Fire Warning", file: "FireWarningSign.fbx", cat: "Decor" },
        { name: "Electrical Warning", file: "ElectricalWarningSign.fbx", cat: "Decor" },
        { name: "Radioactive Warning", file: "RadioActiveWarningSign.fbx", cat: "Decor" }
    ];

    const grid = document.getElementById('asset-grid');
    const modalEl = document.getElementById('modal');
    const loader = new FBXLoader();
    let mainScene, mainCam, mainRenderer, mainControls, currentModel;

    function closeModal() {
        modalEl.style.display = 'none';
        if(currentModel) {
            mainScene.remove(currentModel);
            currentModel = null;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && modalEl.style.display === 'block') closeModal();
    });

    // --- SNAPSHOT WITH IMPROVED LIGHTING ---
    // Fixes the issue where the first 3 models were black
    async function getSnapshot(fileName) {
        return new Promise((resolve) => {
            const size = 256;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(size, size);
            const scene = new THREE.Scene();
            
            // Add a strong ambient light to provide baseline visibility
            scene.add(new THREE.AmbientLight(0xffffff, 1.5)); 
            
            // Add a powerful directional light from an angle to create definition
            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
            
            loader.load(`models/${fileName}`, (obj) => {
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                const bSize = box.getSize(new THREE.Vector3()).length();
                obj.position.sub(center);
                scene.add(obj);
                
                // Position camera at a standard 45-degree angle
                camera.position.set(bSize * 0.9, bSize * 0.9, bSize * 0.9);
                camera.lookAt(0,0,0);
                
                renderer.render(scene, camera);
                const data = renderer.domElement.toDataURL();
                renderer.dispose();
                resolve(data);
            }, undefined, () => resolve(null));
        });
    }

    function renderGrid() {
        const searchVal = document.getElementById('search').value.toLowerCase();
        const catVal = document.getElementById('filter').value;
        grid.innerHTML = "";

        const filtered = myModels.filter(m => 
            (catVal === 'all' || m.cat === catVal) && m.name.toLowerCase().includes(searchVal)
        );

        filtered.forEach(m => {
            const id = m.name.replace(/\s+/g, '');
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="thumb-box" id="thumb-${id}"><span class="gen-text">GENERATING...</span></div>
                <div class="card-info">
                    <span class="card-name">${m.name}</span>
                    <span class="tag">${m.cat}</span>
                </div>
            `;
            grid.appendChild(card);
            card.onclick = () => openModal(m);

            getSnapshot(m.file).then(img => {
                const box = document.getElementById(`thumb-${id}`);
                if(img && box) box.innerHTML = `<img src="${img}" class="thumb-img">`;
            });
        });
    }

    function openModal(m) {
        modalEl.style.display = 'block';
        document.getElementById('m-title').innerText = m.name;
        window.currentFile = m.file;

        if (!mainRenderer) {
            const container = document.getElementById('viewer');
            mainScene = new THREE.Scene();
            // Modal background should match the neutral vibe
            mainScene.background = new THREE.Color(0xf9f9f9);
            mainCam = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 20000);
            mainRenderer = new THREE.WebGLRenderer({ antialias: true });
            mainRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(mainRenderer.domElement);
            
            // Improved Modal Lighting
            mainScene.add(new THREE.AmbientLight(0xffffff, 1));
            const dLight = new THREE.DirectionalLight(0xffffff, 2);
            dLight.position.set(10, 20, 10);
            mainScene.add(dLight);

            mainControls = new OrbitControls(mainCam, mainRenderer.domElement);
            mainControls.enableDamping = true;

            function animate() {
                requestAnimationFrame(animate);
                mainControls.update();
                mainRenderer.render(mainScene, mainCam);
            }
            animate();
        }

        if(currentModel) mainScene.remove(currentModel);
        document.getElementById('m-stats').innerText = "Analyzing mesh...";

        loader.load(`models/${m.file}`, (obj) => {
            currentModel = obj;
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const bSize = box.getSize(new THREE.Vector3()).length();
            obj.position.sub(center);
            mainScene.add(obj);
            mainCam.position.set(bSize, bSize, bSize);
            mainControls.target.set(0,0,0);

            // Correct Stats calculation for Triangles AND Vertices
            let tris = 0;
            let verts = 0;
            obj.traverse(n => { 
                if(n.isMesh) {
                    tris += n.geometry.attributes.position.count / 3;
                    verts += n.geometry.attributes.position.count;
                }
            });
            document.getElementById('m-stats').innerText = `Triangles: ${Math.round(tris).toLocaleString()} | Vertices: ${Math.round(verts).toLocaleString()}`;
        });
    }

    document.getElementById('close-modal').onclick = closeModal;
    document.getElementById('search').oninput = renderGrid;
    document.getElementById('filter').onchange = renderGrid;
    document.getElementById('download-btn').onclick = () => {
        const a = document.createElement('a');
        a.href = `models/${window.currentFile}`;
        a.download = window.currentFile;
        a.click();
    };

    renderGrid();
</script>
</body>
</html>
