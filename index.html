<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Library - Pro Neutral</title>
    <style>
        :root {
            --bg-main: #2b2b2b;        
            --bg-darker: #1e1e1e;      
            --accent: #5c85d6;         
            --text-main: #eeeeee;
            --text-dim: #bbbbbb;
            --border: #444444;
        }

        body { 
            margin: 0; font-family: 'Inter', 'Segoe UI', sans-serif; 
            background: var(--bg-main); color: var(--text-main); 
            overflow-x: hidden;
        }

        header { 
            padding: 40px 20px; text-align: center; 
            background: var(--bg-darker);
            border-bottom: 1px solid var(--border); 
        }

        .controls { display: flex; justify-content: center; gap: 12px; margin-top: 25px; flex-wrap: wrap; }

        input, select { 
            padding: 10px 15px; background: #333; border: 1px solid var(--border); 
            color: white; border-radius: 6px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }

        /* Asset Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px; padding: 40px;
            max-width: 1300px; margin: 0 auto;
        }

        .card {
            background: var(--bg-darker); border-radius: 10px; overflow: hidden;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s; 
            border: 1px solid var(--border);
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .thumb-box {
            width: 100%; height: 160px; background: #111;
            display: flex; align-items: center; justify-content: center;
        }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }
        .gen-text { font-size: 11px; color: #666; font-family: monospace; }

        .card-info { padding: 15px; }
        .card-name { display: block; font-weight: 600; margin-bottom: 4px; }
        .tag { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Modal View */
        .modal {
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.8); z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: 90%; max-width: 1000px; margin: 3% auto;
            background: var(--bg-main); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border); position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        #viewer { width: 100%; height: 500px; background: #1a1a1a; }
        
        .modal-footer { 
            padding: 20px 30px; display: flex; justify-content: space-between; 
            align-items: center; background: var(--bg-darker); 
            border-top: 1px solid var(--border);
        }
        
        .stats-container { display: flex; flex-direction: column; gap: 4px; }
        .m-title { margin: 0; font-size: 1.4rem; color: var(--text-main); }
        .m-stats { color: var(--text-dim); font-family: 'Courier New', monospace; font-size: 0.85rem; margin: 0; }

        #download-btn {
            background: #4a4a4a; color: white; border: 1px solid var(--border);
            padding: 12px 24px; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: 0.2s;
        }
        #download-btn:hover { background: var(--accent); border-color: var(--accent); }

        .close-btn {
            position: absolute; top: 15px; right: 20px; color: #fff;
            font-size: 28px; cursor: pointer; z-index: 1001; opacity: 0.5;
        }
        .close-btn:hover { opacity: 1; }
    </style>
</head>
<body>

<header>
    <h1>3D ASSET LIBRARY</h1>
    <div class="controls">
        <input type="text" id="search" placeholder="Search by name...">
        <select id="filter">
            <option value="all">All Categories</option>
            <option value="Characters">Characters</option>
            <option value="Interactable">Interactable</option>
            <option value="Props">Props</option>
            <option value="Decor">Decor</option>
        </select>
    </div>
</header>

<div class="grid" id="asset-grid"></div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="close-modal">&times;</span>
        <div id="viewer"></div>
        <div class="modal-footer">
            <div class="stats-container">
                <h2 id="m-title" class="m-title">Asset Name</h2>
                <p id="m-stats" class="m-stats">Triangles: 0 | Vertices: 0</p>
            </div>
            <button id="download-btn">DOWNLOAD MODEL</button>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const myModels = [
        { name: "Crate", file: "Crate.fbx", cat: "Interactable" },
        { name: "Robo Arm", file: "RoboArm.fbx", cat: "Interactable" },
        { name: "Robo Arm 2", file: "RoboArm2.fbx", cat: "Interactable" },
        { name: "Robot Classic", file: "Robot.fbx", cat: "Characters" },
        { name: "Robot V2", file: "RobotV2.fbx", cat: "Characters" },
        { name: "Robot V3", file: "RobotV3.fbx", cat: "Characters" },
        { name: "Robot V4", file: "RobotV4.fbx", cat: "Characters" },
        { name: "Generator", file: "Generator.fbx", cat: "Props" },
        { name: "Industrial Tank", file: "IndustrialTank.fbx", cat: "Props" },
        { name: "Tank Stand", file: "IndustrialTankStand.fbx", cat: "Props" },
        { name: "Tank Tower", file: "IndustrialTankTower.fbx", cat: "Props" },
        { name: "Reservoir", file: "Reservoir.fbx", cat: "Props" },
        { name: "Stand Button", file: "StandButton.fbx", cat: "Props" },
        { name: "Wooden Pallet", file: "WoodenPallet.fbx", cat: "Props" },
        { name: "Wooden Pallet V2", file: "WoodenPalletV2.fbx", cat: "Props" },
        { name: "Metal Barrel", file: "MetalBarrel.fbx", cat: "Props" },
        { name: "Fire Warning", file: "FireWarningSign.fbx", cat: "Decor" },
        { name: "Electrical Warning", file: "ElectricalWarningSign.fbx", cat: "Decor" },
        { name: "Radioactive Warning", file: "RadioActiveWarningSign.fbx", cat: "Decor" }
    ];

    const grid = document.getElementById('asset-grid');
    const modalEl = document.getElementById('modal');
    const loader = new FBXLoader();
    let mainScene, mainCam, mainRenderer, mainControls, currentModel;

    // --- Closing Logic ---
    function closeModal() {
        modalEl.style.display = 'none';
    }

    // Escape Key Listener
    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && modalEl.style.display === 'block') {
            closeModal();
        }
    });

    // --- Automatic Thumbnails ---
    async function getSnapshot(fileName) {
        return new Promise((resolve) => {
            const size = 256;
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(size, size);
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
            
            loader.load(`models/${fileName}`, (obj) => {
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                const bSize = box.getSize(new THREE.Vector3()).length();
                obj.position.sub(center);
                scene.add(obj);
                camera.position.set(bSize * 0.8, bSize * 0.8, bSize * 0.8);
                camera.lookAt(0,0,0);
                renderer.render(scene, camera);
                const data = renderer.domElement.toDataURL();
                renderer.dispose();
                resolve(data);
            }, undefined, () => resolve(null));
        });
    }

    function renderGrid() {
        const searchVal = document.getElementById('search').value.toLowerCase();
        const catVal = document.getElementById('filter').value;
        grid.innerHTML = "";

        const filtered = myModels.filter(m => 
            (catVal === 'all' || m.cat === catVal) && m.name.toLowerCase().includes(searchVal)
        );

        filtered.forEach(m => {
            const id = m.name.replace(/\s+/g, '');
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="thumb-box" id="thumb-${id}"><span class="gen-text">LOADING...</span></div>
                <div class="card-info">
                    <span class="card-name">${m.name}</span>
                    <span class="tag">${m.cat}</span>
                </div>
            `;
            grid.appendChild(card);
            card.onclick = () => openModal(m);

            getSnapshot(m.file).then(img => {
                const box = document.getElementById(`thumb-${id}`);
                if(img && box) box.innerHTML = `<img src="${img}" class="thumb-img">`;
            });
        });
    }

    function openModal(m) {
        modalEl.style.display = 'block';
        document.getElementById('m-title').innerText = m.name;
        window.currentFile = m.file;

        if (!mainRenderer) {
            const container = document.getElementById('viewer');
            mainScene = new THREE.Scene();
            mainScene.background = new THREE.Color(0x1a1a1a);
            mainCam = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 20000);
            mainRenderer = new THREE.WebGLRenderer({ antialias: true });
            mainRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(mainRenderer.domElement);
            mainScene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 4));
            mainControls = new OrbitControls(mainCam, mainRenderer.domElement);
            mainControls.enableDamping = true;

            function animate() {
                requestAnimationFrame(animate);
                mainControls.update();
                mainRenderer.render(mainScene, mainCam);
            }
            animate();
        }

        if(currentModel) mainScene.remove(currentModel);
        document.getElementById('m-stats').innerText = "Analyzing mesh...";

        loader.load(`models/${m.file}`, (obj) => {
            currentModel = obj;
            const box = new THREE.Box3().setFromObject(obj);
            const center = box.getCenter(new THREE.Vector3());
            const bSize = box.getSize(new THREE.Vector3()).length();
            obj.position.sub(center);
            mainScene.add(obj);
            mainCam.position.set(bSize, bSize, bSize);
            mainControls.target.set(0,0,0);

            let tris = 0;
            let verts = 0;
            obj.traverse(n => { 
                if(n.isMesh) {
                    tris += n.geometry.attributes.position.count / 3;
                    verts += n.geometry.attributes.position.count;
                }
            });
            document.getElementById('m-stats').innerText = `Triangles: ${Math.round(tris).toLocaleString()} | Vertices: ${Math.round(verts).toLocaleString()}`;
        });
    }

    document.getElementById('close-modal').onclick = closeModal;
    document.getElementById('search').oninput = renderGrid;
    document.getElementById('filter').onchange = renderGrid;
    document.getElementById('download-btn').onclick = () => {
        const a = document.createElement('a');
        a.href = `models/${window.currentFile}`;
        a.download = window.currentFile;
        a.click();
    };

    renderGrid();
</script>
</body>
</html>
