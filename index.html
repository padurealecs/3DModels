<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Library - FBX Viewer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: #1a1a1a; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: white; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; pointer-events: none; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.2rem; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0 0 10px 0;">3D Model Library</h2>
        <p id="status">Status: Se inițializează...</p>
    </div>
    
    <div id="loader">Se încarcă motorul 3D...</div>

    <!-- Importam Three.js si modulele necesare direct din CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        // --- CONFIGURARE ---
        // Schimbă aici cu numele fișierului tău din folderul models/
        const MODEL_PATH = 'models/Generator.fbx'; 

        init();

        function init() {
            // 1. SCENA
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            scene.fog = new THREE.Fog(0x333333, 1000, 5000);

            // 2. CAMERA
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(200, 200, 500);

            // 3. LUMINI
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(100, 200, 100);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 4. RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 5. CONTROALE
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 6. ÎNCĂRCARE MODEL
            const loader = new FBXLoader();
            const statusText = document.getElementById('status');
            const loaderDiv = document.getElementById('loader');

            statusText.innerText = "Status: Se încarcă modelul...";

            loader.load(MODEL_PATH, (object) => {
                // Auto-scale și centrare
                const box = new THREE.Box3().setFromObject(object);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());

                object.position.x += (object.position.x - center.x);
                object.position.y += (object.position.y - center.y);
                object.position.z += (object.position.z - center.z);
                
                scene.add(object);
                
                statusText.innerText = "Status: Model afișat";
                loaderDiv.style.display = 'none';
                
                // Ajustăm camera să vadă tot modelul
                camera.position.copy(center);
                camera.position.x += size / 1.5;
                camera.position.y += size / 1.5;
                camera.position.z += size / 1.5;
                camera.lookAt(center);
                controls.target.copy(center);

            }, (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loaderDiv.innerText = `Se încarcă: ${percent}%`;
            }, (error) => {
                console.error(error);
                statusText.innerText = "Eroare: Verifică dacă fișierul există în folderul models/";
                loaderDiv.innerText = "Eroare la încărcare!";
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
