<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Library - Auto Thumbnails</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #161616;
            --accent: #007bff;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: var(--bg); color: white; 
        }

        header { padding: 30px; text-align: center; border-bottom: 1px solid #222; }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        input, select { 
            padding: 10px; background: #222; border: 1px solid #444; 
            color: white; border-radius: 5px; 
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; padding: 40px;
        }

        .card {
            background: var(--card); border-radius: 10px; overflow: hidden;
            cursor: pointer; transition: 0.3s; border: 1px solid #333;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }

        /* The canvas used for thumbnails */
        .thumb-canvas {
            width: 100%; height: 150px; background: #000;
            display: block; object-fit: cover;
        }

        .card-info { padding: 12px; font-size: 0.9rem; }
        .tag { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        /* Modal */
        .modal {
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.9); z-index: 1000;
        }
        .modal-content {
            width: 90%; max-width: 900px; margin: 50px auto;
            background: #111; border-radius: 15px; overflow: hidden;
        }
        #viewer { width: 100%; height: 500px; position: relative; }
        .details { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        #download-btn {
            background: var(--accent); color: white; border: none;
            padding: 12px 25px; border-radius: 5px; cursor: pointer;
        }

        #hidden-renderer { display: none; } /* Used for generating thumbs */
    </style>
</head>
<body>

<header>
    <h1>3D ASSET EXPLORER</h1>
    <div class="controls">
        <input type="text" id="search" placeholder="Search...">
        <select id="filter">
            <option value="all">All</option>
            <option value="Characters">Characters</option>
            <option value="Interactable">Interactable</option>
            <option value="Props">Props</option>
            <option value="Decor">Decor</option>
        </select>
    </div>
</header>

<div class="grid" id="asset-grid"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div id="viewer"></div>
        <div class="details">
            <div>
                <h2 id="m-title" style="margin:0">Name</h2>
                <p id="m-stats" style="color:#666; font-family:monospace;"></p>
            </div>
            <button id="download-btn">Download FBX</button>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const myModels = [
        { name: "Crate", file: "Crate.fbx", cat: "Interactable" },
        { name: "Robot", file: "Robot.fbx", cat: "Characters" },
        { name: "Generator", file: "Generator.fbx", cat: "Props" },
        { name: "Warning Sign", file: "FireWarningSign.fbx", cat: "Decor" }
        // Add more...
    ];

    const grid = document.getElementById('asset-grid');
    const loader = new FBXLoader();
    let mainScene, mainCam, mainRenderer, mainControls;

    // --- 1. THUMBNAIL GENERATOR ENGINE ---
    // This creates a tiny temporary renderer to "take a photo" of the model
    async function getThumbnail(fileName) {
        return new Promise((resolve) => {
            const width = 200, height = 150;
            const thumbRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            thumbRenderer.setSize(width, height);
            
            const thumbScene = new THREE.Scene();
            thumbScene.background = new THREE.Color(0x111111);
            
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
            thumbScene.add(light);

            const cam = new THREE.PerspectiveCamera(45, width / height, 0.1, 10000);
            
            loader.load(`models/${fileName}`, (obj) => {
                const box = new THREE.Box3().setFromObject(obj);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                obj.position.sub(center);
                thumbScene.add(obj);
                
                cam.position.set(size, size * 0.8, size);
                cam.lookAt(0,0,0);
                
                thumbRenderer.render(thumbScene, cam);
                const dataUrl = thumbRenderer.domElement.toDataURL(); // This is the "Image"
                
                // Cleanup to save memory
                thumbRenderer.dispose();
                resolve(dataUrl);
            }, undefined, () => resolve('https://via.placeholder.com/200x150?text=Error'));
        });
    }

    // --- 2. RENDER GRID ---
    async function initGrid() {
        const searchText = document.getElementById('search').value.toLowerCase();
        const catFilter = document.getElementById('filter').value;
        grid.innerHTML = "";

        const filtered = myModels.filter(m => 
            (catFilter === 'all' || m.cat === catFilter) && 
            m.name.toLowerCase().includes(searchText)
        );

        for (const m of filtered) {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Temporary loading state
            card.innerHTML = `
                <div class="thumb-canvas" style="display:flex; align-items:center; justify-content:center; font-size:10px; color:#555;">Loading Preview...</div>
                <div class="card-info">
                    <span class="card-name"><b>${m.name}</b></span><br>
                    <span class="tag">${m.cat}</span>
                </div>
            `;
            grid.appendChild(card);
            card.onclick = () => openModal(m);

            // Generate thumbnail on the fly
            getThumbnail(m.file).then(url => {
                const img = new Image();
                img.src = url;
                img.className = "thumb-canvas";
                card.querySelector('.thumb-canvas').replaceWith(img);
            });
        }
    }

    // --- 3. MAIN VIEWER (MODAL) ---
    function openModal(m) {
        document.getElementById('modal').style.display = 'block';
        document.getElementById('m-title').innerText = m.name;
        
        if (!mainRenderer) {
            const container = document.getElementById('viewer');
            mainScene = new THREE.Scene();
            mainScene.background = new THREE.Color(0x050505);
            mainCam = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 20000);
            
            mainRenderer = new THREE.WebGLRenderer({ antialias: true });
            mainRenderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(mainRenderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
            mainScene.add(light);
            
            mainControls = new OrbitControls(mainCam, mainRenderer.domElement);
            
            function anim() {
                requestAnimationFrame(anim);
                mainControls.update();
                mainRenderer.render(mainScene, mainCam);
            }
            anim();
        }

        // Load specific model
        if(currentModel) mainScene.remove(currentModel);
        loader.load(`models/${m.file}`, (obj) => {
            currentModel = obj;
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3()).length();
            obj.position.sub(box.getCenter(new THREE.Vector3()));
            mainScene.add(obj);
            mainCam.position.set(size, size, size);
            
            // Polycount
            let tris = 0;
            obj.traverse(n => { if(n.isMesh) tris += n.geometry.attributes.position.count / 3; });
            document.getElementById('m-stats').innerText = `Polygons: ${Math.round(tris).toLocaleString()}`;
        });

        window.currentFile = m.file;
    }

    let currentModel;

    // Events
    document.getElementById('search').oninput = initGrid;
    document.getElementById('filter').onchange = initGrid;
    document.getElementById('modal').onclick = (e) => { if(e.target.id === 'modal') e.target.style.display='none'; }
    document.getElementById('download-btn').onclick = () => {
        const a = document.createElement('a');
        a.href = `models/${window.currentFile}`;
        a.download = window.currentFile;
        a.click();
    };

    initGrid();
</script>
</body>
</html>
