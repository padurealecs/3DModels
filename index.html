<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Library - Grid Viewer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; display: flex; }
        
        /* Meniul Lateral */
        #sidebar { 
            width: 250px; height: 100vh; background: #2c2c2c; color: white; 
            padding: 20px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid #444;
            z-index: 100;
        }
        
        .model-card {
            background: #3d3d3d; padding: 10px; margin-bottom: 10px; border-radius: 5px;
            cursor: pointer; transition: 0.3s; text-align: center; border: 2px solid transparent;
        }
        .model-card:hover { background: #505050; border-color: #007bff; }
        .model-card.active { border-color: #007bff; background: #444; }

        /* Zona de Vizualizare */
        #viewer-container { flex-grow: 1; position: relative; height: 100vh; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; display: none; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h3>Modele 3D</h3>
        <div id="model-list">
            <!-- Aici vor apărea modelele tale -->
        </div>
    </div>

    <div id="viewer-container">
        <div id="loader">Se încarcă...</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- LISTA TA DE MODELE ---
        // Adaugă aici numele fișierelor tale exact cum sunt în folderul models/
        const myModels = [
            { name: "Crate", file: "Crate.fbx" },
            { name: "ElectricalWarningSign", file: "ElectricalWarningSign.fbx" },
            { name: "FirelWarningSign", file: "FireWarningSign.fbx" },
            { name: "ForkliftTrolley", file: "ForkliftTrolley.fbx" },
            { name: "Generator", file: "Generator.fbx" },
            { name: "IndustrialTank", file: "IndustrialTank.fbx" },
            { name: "IndustrialTankStand", file: "IndustrialTankStand.fbx" },
            { name: "IndustrialTankTower", file: "IndustrialTankTower.fbx" },
            { name: "MetalBarrel", file: "MetalBarrel.fbx" },
            { name: "RadioActiveWarningSign", file: "RadioActiveWarningSign.fbx" },
            { name: "Reservoir", file: "Reservoir.fbx" },
            { name: "RoboArm", file: "RoboArm.fbx" },
            { name: "RoboArm2", file: "RoboArm2.fbx" },
            { name: "Robot", file: "Robot.fbx" },
            { name: "RobotV2", file: "RobotV2.fbx" },
            { name: "RobotV3", file: "RobotV3.fbx" },
            { name: "RobotV4", file: "RobotV4.fbx" },
            { name: "StandButton", file: "StandButton.fbx" },
            { name: "WoodenPallet", file: "WoodenPallet.fbx" },
            { name: "WoodenPalletV2", file: "WoodenPalletV2.fbx" },
            
        ];

        let scene, camera, renderer, controls, currentModel;
        const loader = new FBXLoader();
        const loaderUI = document.getElementById('loader');

        init();
        createMenu();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 250) / window.innerHeight, 1, 10000);
            camera.position.set(200, 200, 500);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
            document.getElementById('viewer-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            window.addEventListener('resize', onWindowResize);
            animate();
            
            // Încarcă primul model implicit
            if(myModels.length > 0) loadModel(myModels[0].file);
        }

        function createMenu() {
            const listContainer = document.getElementById('model-list');
            myModels.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = 'model-card';
                div.innerText = m.name;
                div.onclick = () => {
                    document.querySelectorAll('.model-card').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    loadModel(m.file);
                };
                listContainer.appendChild(div);
            });
        }

        function loadModel(fileName) {
            if (currentModel) scene.remove(currentModel);
            loaderUI.style.display = 'block';

            loader.load(`models/${fileName}`, (object) => {
                currentModel = object;
                
                // Centrare automată
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3()).length();
                
                object.position.sub(center); // îl mută în originea 0,0,0
                scene.add(object);

                // Resetăm camera să vadă noul model
                camera.position.set(size, size, size);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                
                loaderUI.style.display = 'none';
            }, (xhr) => {
                loaderUI.innerText = `Încărcare: ${Math.round(xhr.loaded / xhr.total * 100)}%`;
            }, (err) => {
                console.error(err);
                loaderUI.innerText = "Eroare la încărcare!";
            });
        }

        function onWindowResize() {
            camera.aspect = (window.innerWidth - 250) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
