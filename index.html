<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>3D ASSET LIBRARY</h1>
    <div class="controls">
        <input type="text" id="search" placeholder="Search models...">
        <select id="filter">
            <option value="all">All Categories</option>
            <option value="Characters">Characters</option>
            <option value="Interactable">Interactable</option>
            <option value="Props">Props</option>
            <option value="Decor">Decor</option>
        </select>
    </div>
</header>

<div class="grid" id="asset-grid"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="close-modal">&times;</span>
        <div id="viewer"></div>
        <div class="modal-footer">
            <div class="stats-container">
                <h2 id="m-title" class="m-title">Asset Name</h2>
                <p id="m-stats" class="m-stats">Triangles: 0 | Vertices: 0</p>
            </div>
            <button id="download-btn">DOWNLOAD</button>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module" src="script.js"></script>

</body>
</html>
