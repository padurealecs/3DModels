<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>FBX Viewer</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    select { font-size: 16px; padding: 5px; }
  </style>
</head>
<body>
  <h1>Modele FBX</h1>
  <select id="modelSelect"></select>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/examples/js/loaders/FBXLoader.js"></script>
  <script>
    let scene, camera, renderer, currentModel;

    // init Three.js
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xaaaaaa);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0,1.5,3);
      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff,1);
      light.position.set(5,10,7);
      scene.add(light);

      animate();
    }

    function animate(){
      requestAnimationFrame(animate);
      if(currentModel) currentModel.rotation.y += 0.01;
      renderer.render(scene,camera);
    }

    // load models from JSON
    async function loadModels(){
      const response = await fetch('metadata/models.json');
      const models = await response.json();

      const select = document.getElementById('modelSelect');
      models.forEach((m,i)=>{
        const option = document.createElement('option');
        option.value = i;
        option.text = m.name;
        select.appendChild(option);
      });

      select.addEventListener('change', ()=>{
        loadModel(models[select.value].file);
      });

      if(models.length>0) loadModel(models[0].file);
    }

    function loadModel(url){
      if(currentModel) scene.remove(currentModel);
      const loader = new THREE.FBXLoader();
      loader.load(url, gltf=>{
        currentModel = gltf;
        scene.add(currentModel);
        document.getElementById('status').innerText = `Model loaded: ${url}`;
      }, undefined, err=>{
        console.error(err);
        document.getElementById('status').innerText = `Error loading ${url}`;
      });
    }

    init();
    loadModels();
  </script>
</body>
</html>
