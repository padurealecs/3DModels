<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asset Store - Grid View</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-color: #007bff;
            --text-color: #ffffff;
        }

        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); color: var(--text-color);
            overflow-x: hidden;
        }

        /* Header & Search Area */
        header {
            padding: 30px;
            background: linear-gradient(to bottom, #1a1a1a, var(--bg-color));
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .controls {
            display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap;
        }

        #search-input, #category-filter {
            padding: 12px 20px; border-radius: 8px; border: 1px solid #444;
            background: #252525; color: white; font-size: 1rem; outline: none;
        }
        #search-input { width: 300px; }

        /* Grid System */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .model-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #333;
            position: relative;
        }

        .model-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card-icon { font-size: 3rem; margin-bottom: 15px; display: block; }
        .card-name { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .card-tag { 
            font-size: 0.8rem; background: #333; padding: 3px 10px; 
            border-radius: 20px; color: #aaa; 
        }

        /* MODAL / POP-UP */
        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative; background: #1a1a1a; margin: 2% auto;
            width: 90%; max-width: 1000px; border-radius: 20px;
            overflow: hidden; border: 1px solid #444;
        }

        .close-button {
            position: absolute; right: 20px; top: 15px; color: white;
            font-size: 30px; cursor: pointer; z-index: 1001;
        }

        #viewer-container { width: 100%; height: 500px; background: #111; position: relative; }
        
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; z-index: 10;
        }

        .modal-info { padding: 30px; display: flex; justify-content: space-between; align-items: center; }
        .info-text h2 { margin: 0 0 10px 0; color: var(--accent-color); }
        .stats { color: #888; font-family: monospace; }

        #download-btn {
            background: #28a745; color: white; border: none; padding: 15px 30px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem;
            transition: 0.3s;
        }
        #download-btn:hover { background: #218838; transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <h1>📦 3D Asset Library</h1>
        <div class="controls">
            <input type="text" id="search-input" placeholder="Caută un model...">
            <select id="category-filter">
                <option value="all">Toate categoriile</option>
                <option value="Characters">Characters</option>
                <option value="Interactable">Interactable</option>
                <option value="Props">Props</option>
                <option value="Decor">Decor</option>
            </select>
        </div>
    </header>

    <div id="model-grid" class="grid-container"></div>

    <!-- POP-UP -->
    <div id="model-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <div id="viewer-container">
                <div id="loader">Se inițializează...</div>
            </div>
            <div class="modal-info">
                <div class="info-text">
                    <h2 id="modal-title">Nume Model</h2>
                    <div class="stats" id="model-stats">Triunghiuri: -- | Vertexuri: --</div>
                </div>
                <button id="download-btn">⬇️ Download FBX</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const myModels = [
            { name: "Crate", file: "Crate.fbx", cat: "Interactable", icon: "📦" },
            { name: "Robo Arm", file: "RoboArm.fbx", cat: "Interactable", icon: "🦾" },
            { name: "Robo Arm 2", file: "RoboArm2.fbx", cat: "Interactable", icon: "🦾" },
            { name: "Robot Classic", file: "Robot.fbx", cat: "Characters", icon: "🤖" },
            { name: "Robot V2", file: "RobotV2.fbx", cat: "Characters", icon: "🤖" },
            { name: "Robot V3", file: "RobotV3.fbx", cat: "Characters", icon: "🤖" },
            { name: "Robot V4", file: "RobotV4.fbx", cat: "Characters", icon: "🤖" },
            { name: "Generator", file: "Generator.fbx", cat: "Props", icon: "⚡" },
            { name: "Industrial Tank", file: "IndustrialTank.fbx", cat: "Props", icon: "🛢️" },
            { name: "Tank Stand", file: "IndustrialTankStand.fbx", cat: "Props", icon: "🏗️" },
            { name: "Tank Tower", file: "IndustrialTankTower.fbx", cat: "Props", icon: "🗼" },
            { name: "Reservoir", file: "Reservoir.fbx", cat: "Props", icon: "💧" },
            { name: "Stand Button", file: "StandButton.fbx", cat: "Props", icon: "🔘" },
            { name: "Wooden Pallet", file: "WoodenPallet.fbx", cat: "Props", icon: "🪵" },
            { name: "Wooden Pallet V2", file: "WoodenPalletV2.fbx", cat: "Props", icon: "🪵" },
            { name: "Metal Barrel", file: "MetalBarrel.fbx", cat: "Props", icon: "🛢️" },
            { name: "Fire Warning", file: "FireWarningSign.fbx", cat: "Decor", icon: "🔥" },
            { name: "Electrical Warning", file: "ElectricalWarningSign.fbx", cat: "Decor", icon: "⚡" },
            { name: "Radioactive Warning", file: "RadioActiveWarningSign.fbx", cat: "Decor", icon: "☢️" }
        ];

        let scene, camera, renderer, controls, currentModel, currentFile = "";
        const loader = new FBXLoader();
        const modal = document.getElementById('model-modal');
        const loaderUI = document.getElementById('loader');

        // --- GRID LOGIC ---
        function renderGrid() {
            const grid = document.getElementById('model-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;

            grid.innerHTML = "";
            const filtered = myModels.filter(m => 
                (cat === "all" || m.cat === cat) && 
                m.name.toLowerCase().includes(search)
            );

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <span class="card-icon">${m.icon}</span>
                    <div class="card-name">${m.name}</div>
                    <div class="card-tag">${m.cat}</div>
                `;
                card.onclick = () => openModal(m);
                grid.appendChild(card);
            });
        }

        // --- MODAL & 3D LOGIC ---
        function openModal(model) {
            modal.style.display = "block";
            document.getElementById('modal-title').innerText = model.name;
            currentFile = model.file;
            
            if (!renderer) initThree();
            loadModel(model.file);
        }

        function initThree() {
            const container = document.getElementById('viewer-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 20000);
            
            const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 2.5);
            scene.add(ambient);

            const direct = new THREE.DirectionalLight(0xffffff, 2);
            direct.position.set(100, 200, 100);
            scene.add(direct);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            animate();
        }

        function loadModel(fileName) {
            if (currentModel) scene.remove(currentModel);
            loaderUI.style.display = 'block';
            loaderUI.innerText = "Se descarcă...";

            loader.load(`models/${fileName}`, (object) => {
                currentModel = object;
                
                // Extragere Statistici (Fețe/Triunghiuri)
                let tris = 0;
                let verts = 0;
                object.traverse(node => {
                    if (node.isMesh) {
                        const geom = node.geometry;
                        tris += geom.index ? geom.index.count / 3 : geom.attributes.position.count / 3;
                        verts += geom.attributes.position.count;
                    }
                });

                document.getElementById('model-stats').innerText = 
                    `Triunghiuri: ${Math.round(tris).toLocaleString()} | Vertexuri: ${Math.round(verts).toLocaleString()}`;

                // Auto-fit camera
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3()).length();
                object.position.sub(center);
                scene.add(object);

                camera.position.set(size, size, size);
                controls.target.set(0, 0, 0);
                
                loaderUI.style.display = 'none';
            }, (xhr) => {
                const p = Math.round((xhr.loaded / xhr.total) * 100);
                loaderUI.innerText = `Încărcare: ${p}%`;
            });
        }

        // --- EVENTS ---
        document.getElementById('close-modal').onclick = () => modal.style.display = "none";
        window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; }
        
        document.getElementById('download-btn').onclick = () => {
            const a = document.createElement('a');
            a.href = `models/${currentFile}`;
            a.download = currentFile;
            a.click();
        };

        document.getElementById('search-input').oninput = renderGrid;
        document.getElementById('category-filter').onchange = renderGrid;

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer) renderer.render(scene, camera);
        }

        // Inițializare Grid la pornire
        renderGrid();
    </script>
</body>
</html>
